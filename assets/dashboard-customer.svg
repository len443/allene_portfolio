<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e090f" />
      <stop offset="100%" stop-color="#2a0d16" />
    </linearGradient>
    <linearGradient id="cCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38121d" />
      <stop offset="100%" stop-color="#2c0c16" />
    </linearGradient>
    <linearGradient id="cRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c41e3a" />
      <stop offset="100%" stop-color="#ff6584" />
    </linearGradient>
    <linearGradient id="cArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6584" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff6584" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#cBg)" />

  <!-- Top Bar -->
  <rect width="800" height="50" fill="#240a12" />
  <text x="24" y="32" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#ffffff">CUSTOMER RETENTION &amp; CHURN ANALYTICS</text>
  <rect x="620" y="14" width="156" height="24" rx="12" fill="#3f1420" />
  <text x="640" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#ffb8c5">Filter: Last 12 Months ▾</text>

  <!-- KPI Cards -->
  <!-- KPI 1 -->
  <rect x="24" y="70" width="170" height="85" rx="10" fill="url(#cCard)" stroke="#4e1b27" stroke-width="1" />
  <text x="38" y="94" font-family="'Inter', sans-serif" font-size="11" fill="#e6c8cf">TOTAL CUSTOMERS</text>
  <text x="38" y="124" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#ffffff">48,290</text>
  <text x="38" y="142" font-family="'Inter', sans-serif" font-size="10" fill="#ff6584">▲ +12.4% vs last yr</text>

  <!-- KPI 2 -->
  <rect x="214" y="70" width="170" height="85" rx="10" fill="url(#cCard)" stroke="#4e1b27" stroke-width="1" />
  <text x="228" y="94" font-family="'Inter', sans-serif" font-size="11" fill="#e6c8cf">RETENTION RATE</text>
  <text x="228" y="124" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#ffffff">94.2%</text>
  <text x="228" y="142" font-family="'Inter', sans-serif" font-size="10" fill="#ff6584">▲ +2.1% benchmark</text>

  <!-- KPI 3 -->
  <rect x="404" y="70" width="170" height="85" rx="10" fill="url(#cCard)" stroke="#4e1b27" stroke-width="1" />
  <text x="418" y="94" font-family="'Inter', sans-serif" font-size="11" fill="#e6c8cf">CHURN RISK COUNT</text>
  <text x="418" y="124" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#ff6584">1,420</text>
  <text x="418" y="142" font-family="'Inter', sans-serif" font-size="10" fill="#ff94a9">▼ -4.8% improved</text>

  <!-- KPI 4 -->
  <rect x="594" y="70" width="182" height="85" rx="10" fill="url(#cCard)" stroke="#4e1b27" stroke-width="1" />
  <text x="608" y="94" font-family="'Inter', sans-serif" font-size="11" fill="#e6c8cf">AVG LIFETIME VALUE</text>
  <text x="608" y="124" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#ffffff">$3,840</text>
  <text x="608" y="142" font-family="'Inter', sans-serif" font-size="10" fill="#ff6584">▲ +$320 vs target</text>

  <!-- Chart 1: Area Trend (Left Large) -->
  <rect x="24" y="175" width="460" height="300" rx="12" fill="url(#cCard)" stroke="#4e1b27" stroke-width="1" />
  <text x="44" y="206" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#ffffff">Customer Retention Cohort Trend</text>
  <text x="44" y="224" font-family="'Inter', sans-serif" font-size="11" fill="#e6c8cf">Monthly active users vs predicted churn curve</text>
  <!-- Area curve -->
  <path d="M 50 410 L 50 340 Q 120 310, 190 320 T 310 270 T 430 250 L 450 255 L 450 430 L 50 430 Z" fill="url(#cArea)" />
  <path d="M 50 340 Q 120 310, 190 320 T 310 270 T 430 250 L 450 255" fill="none" stroke="url(#cRed)" stroke-width="3" />
  <!-- Grid Lines -->
  <line x1="50" y1="430" x2="460" y2="430" stroke="#4e1b27" stroke-width="1" />
  <line x1="50" y1="360" x2="460" y2="360" stroke="#4e1b27" stroke-width="1" stroke-dasharray="4" />
  <line x1="50" y1="290" x2="460" y2="290" stroke="#4e1b27" stroke-width="1" stroke-dasharray="4" />
  <text x="50" y="450" font-family="'Inter', sans-serif" font-size="10" fill="#e6c8cf">Jan</text>
  <text x="130" y="450" font-family="'Inter', sans-serif" font-size="10" fill="#e6c8cf">Mar</text>
  <text x="210" y="450" font-family="'Inter', sans-serif" font-size="10" fill="#e6c8cf">May</text>
  <text x="290" y="450" font-family="'Inter', sans-serif" font-size="10" fill="#e6c8cf">Jul</text>
  <text x="370" y="450" font-family="'Inter', sans-serif" font-size="10" fill="#e6c8cf">Sep</text>
  <text x="430" y="450" font-family="'Inter', sans-serif" font-size="10" fill="#e6c8cf">Nov</text>

  <!-- Chart 2: Churn by Segment (Right Top) -->
  <rect x="504" y="175" width="272" height="140" rx="12" fill="url(#cCard)" stroke="#4e1b27" stroke-width="1" />
  <text x="522" y="202" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Churn Reason Breakdown</text>
  <!-- Bar 1 -->
  <text x="522" y="226" font-family="'Inter', sans-serif" font-size="10" fill="#e6c8cf">Pricing / Value</text>
  <rect x="522" y="232" width="230" height="7" rx="3.5" fill="#4e1b27" />
  <rect x="522" y="232" width="175" height="7" rx="3.5" fill="#ff6584" />
  <!-- Bar 2 -->
  <text x="522" y="258" font-family="'Inter', sans-serif" font-size="10" fill="#e6c8cf">Competitor Shift</text>
  <rect x="522" y="264" width="230" height="7" rx="3.5" fill="#4e1b27" />
  <rect x="522" y="264" width="120" height="7" rx="3.5" fill="#c41e3a" />
  <!-- Bar 3 -->
  <text x="522" y="290" font-family="'Inter', sans-serif" font-size="10" fill="#e6c8cf">Feature Gap</text>
  <rect x="522" y="296" width="230" height="7" rx="3.5" fill="#4e1b27" />
  <rect x="522" y="296" width="75" height="7" rx="3.5" fill="#961329" />

  <!-- Chart 3: Satisfaction Donut / Gauge (Right Bottom) -->
  <rect x="504" y="330" width="272" height="145" rx="12" fill="url(#cCard)" stroke="#4e1b27" stroke-width="1" />
  <text x="522" y="356" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Health Score Distribution</text>
  <circle cx="580" cy="410" r="38" fill="none" stroke="#4e1b27" stroke-width="12" />
  <circle cx="580" cy="410" r="38" fill="none" stroke="#ff6584" stroke-width="12" stroke-dasharray="190" stroke-dashoffset="45" />
  <text x="580" y="415" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">88%</text>
  <text x="640" y="398" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff">● High Health</text>
  <text x="640" y="418" font-family="'Inter', sans-serif" font-size="11" fill="#ff6584">● Medium Risk</text>
  <text x="640" y="438" font-family="'Inter', sans-serif" font-size="11" fill="#e6c8cf">● At Risk</text>
</svg>

